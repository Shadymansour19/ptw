name: Build PTW

on:
  workflow_dispatch:        # manual trigger from GitHub UI
  push:
    tags:
      - 'v*'               # auto-trigger on version tags like v1.0.0

jobs:

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'          # caches pip downloads across runs

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka
          key: nuitka-windows-${{ hashFiles('client/**/*.py') }}
          restore-keys: nuitka-windows-

      - name: Install dependencies
        run: pip install nuitka pyqt6 qtawesome reportlab pillow qrcode requests pypdf openpyxl bcrypt keyring pytesseract

      - name: Stage Tesseract OCR (English only)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          Copy-Item -Recurse -Force "C:\Program Files\Tesseract-OCR" tesseract-bin
          Get-ChildItem tesseract-bin\tessdata -Filter *.traineddata |
            Where-Object { $_.Name -notin @('eng.traineddata', 'osd.traineddata') } |
            Remove-Item
          if (!(Test-Path "tesseract-bin\tessdata\eng.traineddata")) { throw "eng.traineddata not found after Tesseract install" }

      - name: Build
        run: >
          python -m nuitka
          --onedir
          --assume-yes-for-downloads
          --show-progress
          --enable-plugin=pyqt6
          --include-data-dir=assets=assets
          --include-data-dir=fonts=fonts
          --include-data-dir=tesseract-bin=tesseract-bin
          --windows-icon-from-ico=assets/sh-logo-trans.ico
          --windows-console-mode=disable
          --output-filename=PTW.exe
          main.py

      - name: Zip output
        run: Compress-Archive -Path main.dist\* -DestinationPath PTW-windows.zip
        shell: pwsh

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: client/PTW-windows.zip


  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'          # caches pip downloads across runs

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('client/**/*.py') }}
          restore-keys: nuitka-linux-

      - name: Install system dependencies
        run: |
          sudo apt-get install -y patchelf libgl1 libegl1 tesseract-ocr
          sudo apt-get install -y tesseract-ocr-eng || true

      - name: Install dependencies
        run: pip install nuitka pyqt6 qtawesome reportlab pillow qrcode requests pypdf openpyxl bcrypt keyring pytesseract

      - name: Stage Tesseract OCR (English only)
        run: |
          mkdir -p tesseract-bin/lib tesseract-bin/tessdata
          TESS_BIN="$(which tesseract)"
          cp "$TESS_BIN" tesseract-bin/tesseract
          ldd "$TESS_BIN" | awk '{print $3}' | grep '^/' | xargs -I{} cp -n {} tesseract-bin/lib/
          find /usr/share -path '*/tessdata/eng.traineddata' -exec cp {} tesseract-bin/tessdata/ \;
          find /usr/share -path '*/tessdata/osd.traineddata' -exec cp {} tesseract-bin/tessdata/ \;
          test -f tesseract-bin/tessdata/eng.traineddata

      - name: Build
        run: >
          python -m nuitka
          --onedir
          --assume-yes-for-downloads
          --show-progress
          --enable-plugin=pyqt6
          --include-data-dir=assets=assets
          --include-data-dir=fonts=fonts
          --include-data-dir=tesseract-bin=tesseract-bin
          --output-filename=PTW
          main.py

      - name: Zip output
        run: zip -r PTW-linux.zip main.dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: client/PTW-linux.zip
