[pytest]
# rootdir for the server half of the suite. `pythonpath` puts server/ on sys.path exactly
# the way `python server/app.py` would (so `from models.PTW import PTW` resolves), plus
# this directory for the shared test helpers.
pythonpath = ../../server ../common .
testpaths = unit api
markers =
    api: needs a reachable PostgreSQL (uses a throwaway database, see api/conftest.py)
filterwarnings =
    ignore::DeprecationWarning
