[pytest]
# rootdir for the client half of the suite. `pythonpath` puts client/ on sys.path exactly
# the way `python client/main.py` would, plus this directory for the shared test helpers.
pythonpath = ../../client ../common .
testpaths = unit gui reports
qt_api = pyqt6
markers =
    gui: builds real Qt widgets (runs headless via QT_QPA_PLATFORM=offscreen)
filterwarnings =
    ignore::DeprecationWarning
