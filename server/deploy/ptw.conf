# nginx reverse proxy for the PTW server - terminates TLS with the self-signed cert
# from generate_cert.sh and forwards to waitress on 127.0.0.1:5000 (see app.py and
# KNOWN_ISSUES.md H2). Copy/symlink into nginx's sites-enabled (or include it from
# nginx.conf) and reload nginx after editing.
#
# Deliberately NO plain :80 server block. No browser is involved here - the Python
# client fully controls the request scheme itself - so there's nothing that needs a
# redirect-to-443, and not listening on 80 at all is simpler than the usual
# redirect pattern.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;   # replace with the server's static IP/hostname if you want to be explicit

    ssl_certificate     /path/to/server_cert.pem;      # from generate_cert.sh
    ssl_certificate_key /path/to/server_key.pem;        # mode 600, owned by nginx's user

    # Real-time SSE stream (GET /events) - needs its own block, distinct from the
    # general proxy block below, or it silently breaks in two ways:
    #  - nginx buffers proxied responses by default, which defeats streaming entirely.
    #  - nginx's default proxy_read_timeout (60s) is LESS than the client's 65s SSE read
    #    timeout (see client/network/SSEListener.py), so nginx would kill every SSE
    #    connection at 60s and cause constant needless reconnects unless raised here
    #    past that 65s figure.
    location /events {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File uploads/downloads (PTW/IC attachments, MIWI docs) can be sizeable -
        # match the client's own FILE_TIMEOUT (60s) headroom and raise the body size
        # cap past Flask's default proxy expectations.
        proxy_read_timeout 65s;
        client_max_body_size 50M;
    }

    # Optional, not required for H2: since a reverse proxy is already here, this is a
    # low-cost place to add rate limiting for the still-open H3 (no login/reset-password
    # throttling) if you ever want it, e.g. a `limit_req_zone`+`limit_req` pair scoped to
    # the /login and /reset-password locations. Left out here as a separate concern.
}
